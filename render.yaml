# Render Blueprint —— 数分学堂（数学分析学习网站）
# 用法见 DEPLOY_RENDER.md
# 说明：
#   type: static        -> Render 静态站点
#   rootDir             -> 相对仓库根目录，网站代码所在子目录
#   staticPublishPath   -> 发布目录（相对 rootDir）；纯静态站无需构建，直接发布 “.”
services:
  - type: static
    name: shuxue-fenxi
    runtime: static
    rootDir: math-analysis-site
    staticPublishPath: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false
